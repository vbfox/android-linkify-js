skip_lfs: true

pre-commit:
  jobs:
    - name: oxfmt
      glob: "*.{ts,js,mjs,cjs,json,jsonc,yml,yaml,md}"
      run: yarn oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxlint
      glob: "*.{ts,js,mjs,cjs}"
      run: yarn oxlint --no-error-on-unmatched-pattern {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: oxlint
      run: yarn lint
    - name: oxfmt-check
      run: yarn format:check

name: Publish

on:
  push:
    tags: ["v*"]

# No token is used to publish: npm trusted publishing exchanges the workflow's
# OIDC id-token for a short lived publish token, so the job only needs
# `id-token: write`.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js for use with actions
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "yarn"
      - name: Package install
        run: yarn install --immutable
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package.json version $version" >&2
            exit 1
          fi
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Test
        run: yarn test
      # Built explicitly rather than from a `prepack` script: tsdown runs
      # `yarn pack` itself for its attw and publint checks, so a `prepack` that
      # calls tsdown recurses forever. Yarn does not run `prepublishOnly`.
      - name: Build
        run: yarn build
      - name: Publish
        run: yarn npm publish --provenance
